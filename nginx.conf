server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nicht in Suchmaschinen aufnehmen (gilt fuer alle Dateien, auch Videos)
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Aufrufzaehler (eigener Container, nur Zahlen)
    location = /api/count {
        resolver 127.0.0.11 valid=10s;
        set $cnt http://counter:8000;
        proxy_pass $cnt;
        proxy_read_timeout 3s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Videos: Range-Anfragen (Springen in der Zeitleiste) sind in nginx Standard
    location ~* \.mp4$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cache-Control "public, max-age=86400" always;
    }
}
